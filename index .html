<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة الفيديوهات</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background-color: #212529; color: #f8f9fa; font-family:'Tajawal',sans-serif; }
.container { margin-top: 20px; max-width: 900px; }
.card { background-color: #2c3034; color: #f8f9fa; border:1px solid #495057; transition: transform 0.2s ease; cursor:pointer; }
.card:hover { transform: scale(1.02); background-color:#343a40; }
.back-btn { margin-bottom: 20px; padding:10px 20px; border-radius:50px; border:none; cursor:pointer; font-weight:bold; background:#ff006e; color:#1c0029; }
video { border-radius:10px; width:100%; margin-top:10px; }
</style>
</head>
<body>
<div class="container">
  <h1 class="mb-4 text-center text-primary">الفيديوهات</h1>
  <button id="backBtn" class="back-btn d-none">⬅️ رجوع</button>
  <div id="content"></div>
</div>

<script>
let jsonData;
const contentDiv=document.getElementById('content');
const backBtn=document.getElementById('backBtn');
const historyStack=[];

// تحميل البيانات
fetch('./coursatk_scraped_data.json')
.then(res=>res.json())
.then(data=>{
  jsonData=data.data;
  showYears();
})
.catch(err=>{
  contentDiv.innerHTML=`<div class="alert alert-danger">خطأ في تحميل البيانات: ${err.message}</div>`;
});

// تحديث زر الرجوع
function updateBackButton(){ backBtn.classList.toggle('d-none',historyStack.length===0); }
backBtn.addEventListener('click',()=>{ if(historyStack.length>0){ historyStack.pop()(); } updateBackButton(); });

// ===== عرض السنوات =====
function showYears(){
  contentDiv.innerHTML='<h3 class="text-info mb-3">اختر السنة</h3>';
  jsonData.forEach(year=>{
    const card=document.createElement('div');
    card.className='card p-3 mb-2';
    card.textContent=year.year_name;
    card.onclick=()=>{
      historyStack.push(showYears);
      showSubjects(year);
      updateBackButton();
    };
    contentDiv.appendChild(card);
  });
}

// ===== عرض المواد =====
function showSubjects(year){
  contentDiv.innerHTML=`<h3 class="text-info mb-3">المواد في ${year.year_name}</h3>`;
  if(!year.subjects?.length){ contentDiv.innerHTML+='<p>لا توجد مواد</p>'; return; }
  year.subjects.forEach(subject=>{
    const card=document.createElement('div');
    card.className='card p-3 mb-2';
    card.textContent=subject.subject_name;
    card.onclick=()=>{
      historyStack.push(()=>showSubjects(year));
      showTeachers(subject);
      updateBackButton();
    };
    contentDiv.appendChild(card);
  });
}

// ===== عرض المدرسين =====
function showTeachers(subject){
  contentDiv.innerHTML=`<h3 class="text-warning mb-3">المدرسين في ${subject.subject_name}</h3>`;
  if(!subject.teachers?.length){ contentDiv.innerHTML+='<p>لا يوجد مدرسين</p>'; return; }
  subject.teachers.forEach(teacher=>{
    const card=document.createElement('div');
    card.className='card p-3 mb-2';
    card.textContent=teacher.teacher_name;
    card.onclick=()=>{
      historyStack.push(()=>showTeachers(subject));
      showChapters(teacher);
      updateBackButton();
    };
    contentDiv.appendChild(card);
  });
}

// ===== عرض الفصول =====
function showChapters(teacher){
  contentDiv.innerHTML=`<h3 class="text-success mb-3">الفصول بواسطة ${teacher.teacher_name}</h3>`;
  if(!teacher.chapters?.length){ contentDiv.innerHTML+='<p>لا توجد فصول</p>'; return; }
  teacher.chapters.forEach(chapter=>{
    const card=document.createElement('div');
    card.className='card p-3 mb-2';
    card.textContent=chapter.chapter_name;
    card.onclick=()=>{
      historyStack.push(()=>showChapters(teacher));
      showLectures(chapter);
      updateBackButton();
    };
    contentDiv.appendChild(card);
  });
}

// ===== عرض المحاضرات =====
function showLectures(chapter){
  contentDiv.innerHTML=`<h3 class="text-primary mb-3">المحاضرات في ${chapter.chapter_name}</h3>`;
  if(!chapter.lectures?.length){ contentDiv.innerHTML+='<p>لا توجد محاضرات</p>'; return; }
  chapter.lectures.forEach(lecture=>{
    const card=document.createElement('div');
    card.className='card p-3 mb-2';
    card.textContent=lecture.lecture_name;
    card.onclick=()=>{
      historyStack.push(()=>showLectures(chapter));
      showVideos(lecture);
      updateBackButton();
    };
    contentDiv.appendChild(card);
  });
}

// ===== عرض الفيديوهات =====
function showVideos(lecture){
  contentDiv.innerHTML=`<h3 class="text-light mb-3">الفيديوهات في ${lecture.lecture_name}</h3>`;
  if(!lecture.videos?.length){ contentDiv.innerHTML+='<p>لا توجد فيديوهات</p>'; return; }
  lecture.videos.forEach(video=>{
    const card=document.createElement('div');
    card.className='mb-4 p-3 border rounded bg-dark';
    card.innerHTML=`<h5>${video.video_name}</h5>`;
    if(video.links?.length){
      video.links.forEach(link=>{
        const url=link.url || link.link;
        card.innerHTML+=`<video controls><source src="${url}" type="video/mp4">متصفحك لا يدعم الفيديو.</video><p>جودة: ${link.label||link.quality}</p>`;
      });
    } else { card.innerHTML+='<p>لا توجد روابط</p>'; }
    contentDiv.appendChild(card);
  });
}
</script>
</body>
</html>
