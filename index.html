<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة خطوتك التعليمية</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- النجوم المتلألئة -->
<div class="stars" id="star-container"></div>

<!-- الهيدر -->
<div class="header-container">
    <h1 class="main-title">خطوتك التعليمية</h1>
</div>

<!-- الحاوية الرئيسية -->
<div class="app-container">

    <!-- شاشة تسجيل الدخول -->
    <div class="view-section" id="login-view">
        <div class="login-wrapper">
            <input type="text" id="access-code-input" class="login-input" placeholder="أدخل الكود هنا">
            <button class="btn-main" onclick="attemptLogin()">دخول</button>
            <div class="contact-footer">
                <p>للتواصل: </p>
                <a href="https://wa.me/201234567890" target="_blank">واتس اب</a>
            </div>
        </div>
    </div>

    <!-- لوحة الطالب -->
    <div class="view-section" id="student-dashboard-view">
        <div class="dashboard-content-flow">
            <div class="quote-box" id="dynamic-greeting">مرحباً بك!</div>
            <div class="progress-container">
                <div class="progress-title">تقدمك الأكاديمي</div>
                <div class="progress-bar-wrapper">
                    <div id="academic-progress-bar" class="progress-bar"></div>
                </div>
                <div class="progress-text"><span id="progress-percentage">0%</span></div>
            </div>

            <div class="grid-container" id="subjects-grid"></div>

            <div class="separation-bar">معلومات الطالب</div>
            <div class="student-info-section">
                <div class="student-info">
                    <p>الاسم: <strong id="student-name-display"></strong></p>
                    <p>التخصص: <strong id="student-stream-display"></strong></p>
                    <p>الكود: <span class="code-value" id="student-code-display"></span></p>
                    <p>انتهاء الكود: <strong id="expiry-date-display"></strong></p>
                </div>
                <div class="sidebar-buttons">
                    <button class="btn-logout" onclick="logoutUser()">تسجيل الخروج</button>
                </div>
            </div>
        </div>
    </div>

    <!-- شاشة المدرسين -->
    <div class="view-section" id="teachers-view">
        <button class="btn-back" onclick="showView('student-dashboard-view')"><i class="fas fa-arrow-left"></i> رجوع</button>
        <h2 id="selected-subject-header"></h2>
        <div class="grid-container" id="teachers-grid"></div>
    </div>

    <!-- شاشة الكورسات -->
    <div class="view-section" id="courses-view">
        <button class="btn-back" onclick="showView('teachers-view')"><i class="fas fa-arrow-left"></i> رجوع</button>
        <h2 id="selected-teacher-header"></h2>
        <div class="courses-flex"></div>
    </div>

    <!-- شاشة الأسابيع -->
    <div class="view-section" id="weeks-view">
        <button class="btn-back" onclick="showView('courses-view')"><i class="fas fa-arrow-left"></i> رجوع</button>
        <h2 id="selected-week-header"></h2>
        <div class="grid-container" id="weeks-grid"></div>
    </div>

    <!-- شاشة المشرف -->
    <div class="view-section" id="admin-panel-view">
        <h2>لوحة المشرف</h2>
        <div class="admin-panel">
            <div class="admin-form">
                <input type="text" id="new-student-name" placeholder="اسم الطالب" class="admin-input">
                <select id="new-student-stream" class="admin-select">
                    <option value="science">علمي علوم</option>
                    <option value="math">علمي رياضة</option>
                </select>
                <input type="number" id="new-code-duration" placeholder="مدة الكود بالساعات" class="admin-input">
                <button class="btn-admin btn-generate" onclick="generateNewCode()">إنشاء كود جديد</button>
            </div>
            <table class="data-table">
                <thead>
                    <tr><th>الاسم</th><th>الكود</th><th>التخصص</th><th>تاريخ الانتهاء</th><th>الحالة</th></tr>
                </thead>
                <tbody id="codes-table-body"></tbody>
            </table>
        </div>
    </div>

</div>

<!-- Modal الفيديو -->
<div class="modal-overlay" id="video-modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeVideoModal()">&times;</span>
        <h3 id="modal-video-title" class="modal-title"></h3>
        <div class="video-container">
            <iframe id="video-iframe" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
                                                                    </html>
