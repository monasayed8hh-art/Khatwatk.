<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة خطوتك التعليمية المتكاملة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<link rel="stylesheet" href="style.css">

<style>
:root {
    --primary-color: #4a00d6;
    --accent-color: #ff4db0;
    --gold: #f3c623;
    --text-light: #f8f9fa;
}
body { font-family:'Tajawal',sans-serif; margin:0; padding:0; background:#121212; color:var(--text-light); }
.btn-back i { transform: rotate(180deg); } /* تصحيح اتجاه السهم للعودة */
</style>

</head>
<body onload="initApp()"> 

<div class="stars" id="star-container"></div>

<header class="header-container">
    <h1 class="main-title">✨ خطوتك ✨</h1>
    <p class="sub-title" id="sub-title">منصتك التعليمية المتكاملة</p>
</header>

<main class="app-container">

<!-- بوابة الدخول -->
<section id="login-view" class="view-section active">
    <div class="login-wrapper">
        <h2 style="margin-bottom:20px; color: var(--accent-color);">بوابة الدخول الموحدة</h2>
        <input type="text" id="access-code-input" class="login-input" placeholder="ادخل الكود هنا 🔑">
        <button class="btn-main" onclick="attemptLogin()">دخول للمنصة 🚀</button>
        <div class="contact-footer">
            <p style="font-weight:bold; color:white; margin-bottom:10px;">للحصول على كود الاشتراك (خطوتك):</p>
            <a href="https://chat.whatsapp.com/HBZCFogEwom2l7kVErZvJE?mode=wwt" target="_blank">📱 اضغط هنا للانضمام لجروب الواتساب</a>
        </div>
    </div>
</section>

<!-- باقي الأقسام ... كما في كودك -->
<!-- تأكد من وجود جميع الدوال في script.js مثل initApp, attemptLogin, logoutUser, showView ... إلخ -->

</main>

<!-- مودال الفيديو -->
<div id="video-modal" class="modal-overlay" onclick="closeVideoModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeVideoModal()">&times;</span>
        <h3 id="modal-video-title" class="modal-title">عنوان الفيديو</h3>
        <div class="video-container">
            <iframe id="video-iframe" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="modal-info">
            <p>💡 ملاحظة: يتم تشغيل الفيديو مباشرة داخل المنصة (Embed).</p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
